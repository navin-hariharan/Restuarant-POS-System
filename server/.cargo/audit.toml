# cargo audit settings
[advisories]
# RUSTSEC-2023-0071 (rsa "Marvin" timing attack) concerns RSA *decryption and
# signing* with a private key. sqlx-mysql only uses rsa to *encrypt* the
# database password with the server's public key (caching_sha2_password on a
# non-TLS connection), so the attack does not apply. No fixed rsa release exists.
ignore = ["RUSTSEC-2023-0071"]
